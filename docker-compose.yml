services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: delichat_postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # KAN-7: RAG 평가 이벤트 fan-out(judge/재질문 카운터/FAQ 개선 후보 추출)용 브로커.
  # KRaft 단일 노드 모드라 Zookeeper 불필요 - 로컬 개발 전용 구성.
  kafka:
    image: apache/kafka:3.7.0
    container_name: delichat_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # KAN-7: 재질문/미매칭 카운터 컨슈머가 쓰는 Sorted Set 저장소.
  redis:
    image: redis:7-alpine
    container_name: delichat_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: