# replicas=2로 안전한 이유: RagEvalOutboxRelayService의 클레임이 FOR UPDATE SKIP LOCKED 기반이라
# 여러 인스턴스가 동시에 outbox를 relay해도 중복 발행되지 않는다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: delichat-app
  namespace: delichat
  labels:
    app: delichat-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: delichat-app
  template:
    metadata:
      labels:
        app: delichat-app
    spec:
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: delichat-app
                topologyKey: kubernetes.io/hostname
              weight: 100
      containers:
        - name: delichat-app
          image: delichat:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - secretRef:
                name: delichat-secrets
          env:
            - name: DB_HOST
              value: "postgres-service"
            - name: DB_PORT
              value: "5432"
            - name: REDIS_HOST
              value: "redis-service"
            - name: REDIS_PORT
              value: "6379"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-0.kafka-headless.delichat.svc.cluster.local:9092,kafka-1.kafka-headless.delichat.svc.cluster.local:9092,kafka-2.kafka-headless.delichat.svc.cluster.local:9092"
            - name: KAFKA_REPLICATION_FACTOR
              value: "3"
            - name: KAFKA_MIN_INSYNC_REPLICAS
              value: "2"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
